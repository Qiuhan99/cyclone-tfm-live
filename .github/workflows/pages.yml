name: Refresh public data and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: public-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Expand first browser upload into readable source files
        id: bootstrap
        shell: bash
        run: |
          if [ ! -f pyproject.toml ]; then
            python3 - <<'PY'
          import os, pathlib, stat, zipfile
          with zipfile.ZipFile('cyclone-tfm-live.zip') as archive:
              for entry in archive.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts or not path.parts:
                      raise ValueError('unsafe archive path')
                  if path.parts[0] in ('.git', '.github', '.runtime', '.venv', '.openai'):
                      continue
                  if stat.S_ISLNK(entry.external_attr >> 16):
                      raise ValueError('symlink archive entry rejected')
                  archive.extract(entry, '.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('expanded=true\n')
          PY
          fi
      - name: Keep uploaded package browsable as normal source
        if: steps.bootstrap.outputs.expanded == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src site tools tests README.md NOTICE.md PUBLIC_EXPORT.json pyproject.toml .gitignore
          git commit -m 'Expand public website and data publisher source'
          git push origin HEAD:main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Restore last published public state
        run: python tools/live_branch.py restore
      - name: Check official data and external paths
        run: cyclone-live refresh --site site
      - name: Validate public release and run tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
          python tools/check_public.py
      - name: Save latest public state
        run: python tools/live_branch.py save
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
