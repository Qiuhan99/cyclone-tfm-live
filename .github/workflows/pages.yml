name: Refresh public data and deploy Pages
on:
  push:
    branches: [main, live-data]
  workflow_dispatch:
    inputs:
      repair_bot:
        description: 'Apply owner-approved metadata-only bot contributor repair (backup retained)'
        type: boolean
        default: false
  schedule:
    - cron: '7,37 * * * *'
  workflow_run:
    workflows: ['Refresh public data and deploy Pages']
    types: [completed]
    branches: [live-data]
permissions:
  contents: read
concurrency:
  group: public-pages
  cancel-in-progress: false
jobs:
  model_update:
    if: github.ref == 'refs/heads/live-data'
    runs-on: ubuntu-latest
    steps:
      - name: Notify the protected main-branch deployment workflow
        run: python3 -c "print('Public model snapshot received; main workflow performs deployment.')"
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Import tested full portal release once
        shell: bash
        run: |
          if [ ! -f PORTAL_RELEASE.json ]; then
            python3 - <<'PYZIP'
          import pathlib, hashlib, stat, zipfile
          archive = pathlib.Path('portal-upgrade-v2.zip')
          if hashlib.sha256(archive.read_bytes()).hexdigest() != '5b6a57a36ec7c83a2b0d82e1b98e26a9c611e65e347c28e7ec5d35b6d95c8257':
              raise ValueError('unreviewed release archive')
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or not path.parts:
                      raise ValueError('unsafe release path')
                  if path.parts[0] not in ('site', 'src', 'tests', 'tools', 'PUBLIC_EXPORT_V2.json', 'PORTAL_RELEASE.json'):
                      raise ValueError('outside approved public scope')
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise ValueError('symlink rejected')
                  z.extract(item, '.')
          PYZIP
          fi
      - name: Apply explicitly approved contributor metadata repair
        if: github.event_name == 'workflow_dispatch' && inputs.repair_bot
        run: python tools/repair_author_history.py --expected-head "$GITHUB_SHA" --apply
      - name: Preserve pre-repair history backup
        if: always() && github.event_name == 'workflow_dispatch' && inputs.repair_bot
        uses: actions/upload-artifact@v4
        with:
          name: history-before-owner-approved-repair
          path: .runtime/before-author-repair.bundle
          retention-days: 7
      - name: Import portal source under existing owner identity
        run: python tools/commit_portal.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Restore latest public state
        run: python tools/live_branch.py restore
      - name: Refresh public sources without retiming private models
        run: cyclone-live refresh --site site
      - name: Validate all restored pages and actual model maps
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
          python tools/build_site_manifest.py
          python tools/check_public.py
      - name: Preserve public data across runs
        run: python tools/live_branch.py save
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
