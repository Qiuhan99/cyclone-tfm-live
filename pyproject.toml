[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclone-tfm-live"
version = "0.1.0"
description = "Qiuhan99's typhoon live viewer and source-preserving public-data publisher"
requires-python = ">=3.10"
authors = [{name = "Qiuhan99"}]
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4"]

[project.scripts]
cyclone-live = "cyclone_tfm_live.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
